    <script>
      // Get form element
      const form = document.getElementById("loginForm");
      const messageDiv = document.getElementById("message");

      // Add submit event listener
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Show loading message
        messageDiv.innerHTML =
          '<div class="message-info">⏳ Logging in...</div>';

        // Get values
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // Validation
        if (!email || !password) {
          messageDiv.innerHTML =
            '<div class="message-error">❌ Please fill all fields</div>';
          return;
        }

        const loginData = { email, password };

        console.log("Sending login request to backend...");

        try {
          const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(loginData),
          });

          console.log("Response status:", response.status);
          const data = await response.json();
          console.log("Response data:", data);

          if (response.ok && data.success) {
            // Save token and user data
            if (data.session && data.session.access_token) {
              localStorage.setItem("token", data.session.access_token);
            }
            localStorage.setItem("user", JSON.stringify(data.user));

            messageDiv.innerHTML = `
                        <div class="message-success">
                            ✅ ${data.message}<br>
                            Welcome ${data.user.name || "User"}!<br>
                            Redirecting to home...
                        </div>
                    `;

            setTimeout(() => {
              window.location.href = "home.html";
            }, 2000);
          } else {
            messageDiv.innerHTML = `<div class="message-error">❌ ${data.message || "Login failed"}</div>`;
          }
        } catch (error) {
          console.error("Fetch error:", error);
          messageDiv.innerHTML = `
                    <div class="message-error">
                        ❌ Cannot connect to server!<br>
                        Make sure backend is running on http://localhost:5000<br>
                        Error: ${error.message}
                    </div>
                `;
        }
      });
    </script>
